  <script>
    tailwind.config = {

            duoBlueDark: '#1899d6',
            duoOrange: '#ff9600',
            duoOrangeDark: '#e08400',
            duoPurple: '#ce82ff',
            duoPurpleDark: '#b060e0',
            duoRed: '#ff4b4b',
            duoRedDark: '#ea2b2b',
            duoYellow: '#ffc800',
            duoYellowDark: '#e0b000',
            duoEmerald: '#10b981',

            duoBgSuccess: '#d7ffb8',
            duoTextSuccess: '#58a700',
            duoBgError: '#ffdfe0',
            duoTextError: '#ea2b2b',
          },
          boxShadow: {

            'btn-red': '0 6px 0 0 #ea2b2b',
            'btn-yellow': '0 6px 0 0 #e0b000',
            'btn-emerald': '0 6px 0 0 #059669',
            'duo-card': '0 5px 0 0 #e2e8f0',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #ffffff;
      color: #1E293B;

<body class="min-h-screen flex flex-col justify-between selection:bg-duoBlue selection:text-white">
  <div id="root" class="flex-1 flex flex-col"></div>

  <footer class="w-full text-center text-xs font-bold text-slate-400 py-6 border-t-2 border-slate-200 bg-white">
    Comprens.io — Entrenament de comprensió lectora per a la PAU.
  </footer>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- SINTETITZADOR D'ÀUDIO WEB AUDIO API ---
    const playSound = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(1046.50, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'gemGain') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(783.99, now);
          osc.frequency.setValueAtTime(1174.66, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'fanfare') {
          osc.type = 'triangle';
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          });
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        }
      } catch (e) {
        console.warn("Àudio no disponible", e);
      }
    };

    const triggerConfetti = () => {
      if (window.confetti) {
        window.confetti({
          particleCount: 100,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#58cc02', '#1cb0f6', '#ff9600', '#ce82ff', '#ffc800']
        });
      }
    };

    // --- VISTA DE LECTURA (TEXT FIX + CORRECCIÓ DIRECTA EN PASOS) ---
    function GameReading({ textData, setCurrentView, onSuccess, onError, onFinish, hearts, setHearts, inventory, setInventory, setShowNoLivesModal }) {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      
      const [tfAnswers, setTfAnswers] = useState({});
      const [shuffledTfItems, setShuffledTfItems] = useState([]);
      const [synAnswers, setSynAnswers] = useState({});
      const [proAnswers, setProAnswers] = useState({});
      const [summaryAnswer, setSummaryAnswer] = useState("");

      const questionScores = useRef({});

      const questions = textData.questions;
      const activeQ = questions[currentQIndex];

      useEffect(() => {
        if (activeQ && activeQ.type === 'tf') {
          setShuffledTfItems([...activeQ.items].sort(() => Math.random() - 0.5));
          setTfAnswers({});
        }
      }, [currentQIndex, activeQ]);

      const progressPerc = ((currentQIndex) / questions.length) * 100;

      // Validador de cada pregunta pas a pas amb indicació d'errors exacta
      const handleCheckStep = () => {
        playSound('pop');

        if (activeQ.type === 'tf') {
          let wrongItems = [];
          let answeredCount = Object.keys(tfAnswers).length;

          shuffledTfItems.forEach((item) => {
            const userAns = tfAnswers[item.id];
            if (userAns !== undefined && userAns !== item.correct) {
              wrongItems.push(item);
            }
          });

          if (answeredCount < shuffledTfItems.length) {
            onError("PREGUNTA INCOMPLETA", "Has de respondre totes les opcions de Vertader o Fals abans de comprovar.", "");
            return;
          }

          if (questionScores.current[currentQIndex] === undefined) {
            let correct = shuffledTfItems.length - wrongItems.length;
            questionScores.current[currentQIndex] = (correct * 0.1) - (wrongItems.length * 0.1);
          }

          if (wrongItems.length === 0) {
            onSuccess("MOLT BÉ! (+0,5 pts)", "Has encertat totes les afirmacions de Vertader / Fals.", "Excel·lent comprensió del text.", 25, () => advanceStep());
          } else {
            const detailMsg = wrongItems.map(w => `• "${w.text.substring(0, 35)}..." era ${w.correct ? 'VERTADER' : 'FALS'}`).join('\n');
            const penalty = (wrongItems.length * 0.1).toFixed(1);
            
            deductHeartOrShield();
            onError(
              "RESPOSTA INCORRECTA (-1 ❤️)", 
              `Has comès ${wrongItems.length} error(s) [Descompte de ${penalty} punts].`, 
              `Correcció de les fallades:\n${detailMsg}`
            );
          }
        } 
        else if (activeQ.type === 'synonyms') {
          let wrongWords = [];
          activeQ.words.forEach((w) => {
            const ans = (synAnswers[w.id] || "").trim().toLowerCase();
            if (ans !== w.answer.toLowerCase()) {
              wrongWords.push({ word: w.word, expected: w.answer, given: ans || "En blanc" });
            }
          });

          if (questionScores.current[currentQIndex] === undefined) {
            let correct = activeQ.words.length - wrongWords.length;
            questionScores.current[currentQIndex] = (correct * 0.1);
          }

          if (wrongWords.length === 0) {
            onSuccess("SINÒNIMS EXACTES! (+0,5 pts)", "Has trobat tots els sinònims en el text.", "", 25, () => advanceStep());
          } else {
            const detailMsg = wrongWords.map(w => `• ${w.word} ➔ La resposta era: "${w.expected}" (has escrit: "${w.given}")`).join('\n');
            deductHeartOrShield();
            onError("SINÒNIMS INCORRECTES (-1 ❤️)", `Has fallat en ${wrongWords.length} sinònim(s).`, detailMsg);
          }
        }
        else if (activeQ.type === 'pronouns') {
          let wrongPron = [];
          activeQ.words.forEach((w) => {
            const ans = (proAnswers[w.id] || "").trim().toLowerCase();
            if (ans !== w.answer.toLowerCase()) {
              wrongPron.push({ pron: w.pronoun, expected: w.answer, given: ans || "En blanc" });
            }
          });

          if (questionScores.current[currentQIndex] === undefined) {
            let correct = activeQ.words.length - wrongPron.length;
            questionScores.current[currentQIndex] = (correct * 0.25);
          }

          if (wrongPron.length === 0) {
            onSuccess("REFERENTS CORRECTES! (+0,5 pts)", "Has identificat el pronom i la construcció completa.", "", 25, () => advanceStep());
          } else {
            const detailMsg = wrongPron.map(w => `• "${w.pron}" ➔ Referent exacte: "${w.expected}"`).join('\n');
            deductHeartOrShield();
            onError("REFERENTS INCORRECTES (-1 ❤️)", "No has escrit el referent exactament com apareix en el text.", detailMsg);
          }
        }
        else if (activeQ.type === 'summary') {
          const userWords = summaryAnswer.toLowerCase().split(/[\s,.]+/);
          let matchCount = 0;
          activeQ.keywords.forEach(kw => {
            if (userWords.includes(kw.toLowerCase())) matchCount++;
          });

          if (questionScores.current[currentQIndex] === undefined) {
            questionScores.current[currentQIndex] = matchCount >= 5 ? 0.5 : 0;
          }

          if (matchCount >= 5) {
            onSuccess("RESUM ACCEPTAT! (+0,5 pts)", `Has inclòs ${matchCount} paraules clau del text.`, `Resposta model: "${activeQ.modelAnswer}"`, 30, () => advanceStep());
          } else {
            deductHeartOrShield();
            onError(
              "RESUM INSUFICIENT (-1 ❤️)", 
              `Només has utilitzat ${matchCount} paraules clau (es requereixen un mínim de 5).`, 
              `Exemple de resposta model:\n"${activeQ.modelAnswer}"`
            );
          }
        }
      };

      const deductHeartOrShield = () => {
        if (inventory.shield > 0) {
          setInventory(p => ({ ...p, shield: p.shield - 1 }));
        } else {
          setHearts(h => {
            const next = Math.max(0, h - 1);
            if (next === 0) {
              setTimeout(() => setShowNoLivesModal(true), 600);
            }
            return next;
          });
        }
      };

      const advanceStep = () => {
        if (currentQIndex + 1 < questions.length) {
          setCurrentQIndex(c => c + 1);
        } else {
          let rawScore = 0;
          Object.values(questionScores.current).forEach(val => rawScore += val);
          let finalScore10 = Math.max(0, rawScore * 5).toFixed(2);
          onFinish(textData.id, 3, 100, textData.title, finalScore10);
        }
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6 pb-20 pt-2">
          {/* BARRA SUPERIOR DE LECCIÓ */}
          <div className="flex items-center gap-4 mb-2">
            <button 
              onClick={() => setCurrentView('path')} 
              className="text-slate-400 hover:text-slate-600 text-2xl font-black transition-transform active:scale-95"
            >
              <i className="fa-solid fa-xmark"></i>
            </button>
            <div className="flex-1 bg-slate-200 h-4 rounded-full overflow-hidden border-2 border-slate-300">
              <div 
                className="bg-duoGreen h-full transition-all duration-500 rounded-full"
                style={{ width: `${progressPerc}%` }}
              ></div>
            </div>
            <span className="font-display font-black text-sm text-slate-400">
              {currentQIndex + 1}/{questions.length}
            </span>
          </div>

          {/* CONTENIDOR DEL TEXT (FIX EN PANTALLA AMB SCROLL PROPI) */}
          <div 
            style={{ borderColor: textData.color }} 
            className="bg-white rounded-[28px] p-6 border-[3px] shadow-duo-card space-y-4 max-h-[280px] sm:max-h-[320px] overflow-y-auto"
          >
            {textData.image && (
              <img src={textData.image} alt="Imatge del text" className="w-full h-36 object-cover rounded-[18px] border-2 border-slate-200 mb-2" />
            )}
            
            <div className="flex items-center justify-between border-b-2 border-slate-100 pb-3">
              <div>
                <h2 className="text-2xl font-display font-black text-slate-800 leading-tight">{textData.title}</h2>
              </div>
              <div 
                style={{ backgroundColor: textData.color }} 
                className="w-10 h-10 rounded-[14px] text-white flex items-center justify-center text-xl shrink-0 shadow-sm"
              >
                <i className={`fa-solid ${textData.icon}`}></i>
              </div>
            </div>

            <div className="text-base text-slate-700 font-medium leading-relaxed whitespace-pre-wrap">
              {textData.content}
            </div>

            {/* AUTOR I FONT AL FINAL DEL TEXT */}
            <div className="border-t-2 border-slate-100 pt-3 mt-4 space-y-3">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">
                Font / Autor: <span className="text-slate-600 font-semibold">{textData.author} ({textData.source})</span>
              </p>

              {/* ETIQUETA REDISENYADA ESTIL DUOLINGO "IA" */}
              {textData.isAiGenerated && (
                <div className="inline-flex items-center gap-2.5 bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 text-white font-display font-black text-xs px-4 py-2 rounded-[16px] shadow-sm border-2 border-purple-300/30">
                  <div className="w-6 h-6 bg-white/20 rounded-lg flex items-center justify-center text-sm shadow-inner">
                    <i className="fa-solid fa-wand-magic-sparkles"></i>
                  </div>
                  <span>IA · Text generat amb IA (Nivell de les PAU)</span>
                </div>
              )}
            </div>
          </div>

          {/* TARGETA DE PREGUNTA ACTIVA */}
          <div className="bg-white rounded-[28px] p-6 border-[3px] border-slate-200 shadow-duo-card space-y-6">
            <h3 className="font-display font-black text-slate-800 text-lg leading-snug">
              {activeQ.statement}
            </h3>

            {/* TIPUS 1: VERTADER O FALS */}
            {activeQ.type === 'tf' && (
              <div className="space-y-4">
                {shuffledTfItems.map((item) => (
                  <div key={item.id} className="bg-slate-50 p-4 rounded-[20px] border-2 border-slate-200 space-y-3">
                    <p className="font-bold text-slate-700 text-sm leading-relaxed">{item.text}</p>
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        onClick={() => { playSound('pop'); setTfAnswers(p => ({ ...p, [item.id]: true })); }}
                        className={`py-3 rounded-[16px] font-display font-black text-base border-b-[4px] border-2 transition-all duo-pressable ${
                          tfAnswers[item.id] === true 
                            ? 'bg-duoGreen text-white border-duoGreenDark shadow-btn-green' 
                            : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        Vertader
                      </button>
                      <button
                        onClick={() => { playSound('pop'); setTfAnswers(p => ({ ...p, [item.id]: false })); }}
                        className={`py-3 rounded-[16px] font-display font-black text-base border-b-[4px] border-2 transition-all duo-pressable ${
                          tfAnswers[item.id] === false 
                            ? 'bg-duoRed text-white border-duoRedDark shadow-btn-red' 
                            : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        Fals
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TIPUS 2: SINÒNIMS */}
            {activeQ.type === 'synonyms' && (
              <div className="space-y-4">
                {activeQ.words.map((w) => (
                  <div key={w.id} className="space-y-2">
                    <label className="font-display font-black text-slate-700 text-sm block">
                      Sinònim per a: <span className="text-duoBlue">{w.word}</span>
                    </label>
                    <input 
                      type="text" 
                      value={synAnswers[w.id] || ""}
                      onChange={(e) => setSynAnswers(p => ({ ...p, [w.id]: e.target.value }))}
                      placeholder="Escriu el mot del text..."
                      className="w-full bg-slate-50 border-2 border-slate-300 rounded-[16px] p-3.5 font-bold text-slate-800 outline-none focus:border-duoBlue focus:bg-white"
                    />
                  </div>
                ))}
              </div>
            )}

            {/* TIPUS 3: PRONOMS */}
            {activeQ.type === 'pronouns' && (
              <div className="space-y-4">
                {activeQ.words.map((w) => (
                  <div key={w.id} className="space-y-2">
                    <label className="font-display font-black text-slate-700 text-sm block">
                      Referent de: <span className="text-duoPurple">"{w.pronoun}"</span>
                    </label>
                    <input 
                      type="text" 
                      value={proAnswers[w.id] || ""}
                      onChange={(e) => setProAnswers(p => ({ ...p, [w.id]: e.target.value }))}
                      placeholder="Escriu la construcció completa..."
                      className="w-full bg-slate-50 border-2 border-slate-300 rounded-[16px] p-3.5 font-bold text-slate-800 outline-none focus:border-duoPurple focus:bg-white"
                    />
                  </div>
                ))}
              </div>
            )}

            {/* TIPUS 4: RESUM */}
            {activeQ.type === 'summary' && (
              <div className="space-y-3">
                <textarea 
                  rows="4" 
                  value={summaryAnswer}
                  onChange={(e) => setSummaryAnswer(e.target.value)}
                  placeholder="Escriu la teva resposta (màxim 50 mots)..."
                  className="w-full bg-slate-50 border-2 border-slate-300 rounded-[16px] p-4 font-bold text-slate-800 outline-none focus:border-duoGreen focus:bg-white leading-relaxed"
                />
                <div className="flex justify-between text-xs font-bold text-slate-400">
                  <span>S'avalua mitjançant paraules clau del text</span>
                  <span>Mots: {summaryAnswer.trim() ? summaryAnswer.trim().split(/\s+/).length : 0}/50</span>
                </div>
              </div>
            )}

            <button
              onClick={handleCheckStep}
              className="w-full bg-duoBlue hover:bg-duoBlueDark text-white font-display font-black text-lg py-4 rounded-[20px] shadow-btn-blue border-x-2 border-t-2 border-b-[6px] border-black/10 duo-pressable uppercase tracking-wider mt-4"
            >
              Comprovar Resposta
            </button>
          </div>
        </div>
      );
    }

    // --- MAPA RUTA DE TEXTOS ---
    function PathMap({ texts, setCurrentView, startText, nodeProgress }) {
      return (
        <div className="space-y-8 pb-16 pt-4 max-w-md mx-auto">
          <div className="bg-gradient-to-r from-duoBlue to-duoPurple text-white p-6 rounded-[28px] shadow-duo-3d border-b-[6px] border-black/10">
            <h2 className="text-2xl font-display font-black">Ruta de Comprensió Lectora</h2>
            <p className="text-white/90 text-sm font-bold mt-1">
              Supera cada text per dominar la prova de la PAU.
            </p>
          </div>

          <div className="relative py-6 flex flex-col items-center space-y-12">
            <div className="absolute top-8 bottom-24 left-1/2 w-8 bg-slate-200 -translate-x-1/2 rounded-full z-0 border-x-[3px] border-slate-300 opacity-60"></div>

            {texts.map((txt, index) => {
              const stars = nodeProgress[txt.id] || 0;
              const offsetClass = index % 2 === 0 ? '-translate-x-12 sm:-translate-x-16' : 'translate-x-12 sm:translate-x-16';
 
              return (
                <div key={txt.id} className={`relative flex flex-col items-center ${offsetClass} z-10`}>
                  <button
                    onClick={() => startText(txt)}
                    style={{ backgroundColor: txt.color }}
                    className="w-24 h-24 sm:w-28 sm:h-28 rounded-full text-white flex flex-col items-center justify-center text-3xl sm:text-4xl shadow-md border-b-[8px] border-2 border-black/20 hover:scale-105 active:scale-95 transition-transform relative group duo-pressable"
                  >
                    <i className={`fa-solid ${txt.icon}`}></i>
                    {stars > 0 && (
                      <div className="absolute -top-3 bg-white text-amber-500 border-2 border-amber-400 text-xs px-2.5 py-0.5 rounded-full font-black flex items-center gap-1 shadow-md">
                        <i className="fa-solid fa-crown text-[10px]"></i>
                        <span>{stars}</span>
                      </div>
                    )}
                  </button>

                  <div className="absolute -bottom-8 w-36 text-center">
                    <span className="font-display font-black text-sm text-slate-600 block line-clamp-1">
                      {txt.title}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- VISTA DE DESCÀRREGUES (PDF EXPORTS) ---
    function DownloadView({ setCurrentView, texts }) {

                <h1 style="font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 800; color: #ef4444; border-bottom: 4px solid #fca5a5; padding-bottom: 10px; margin-bottom: 30px; page-break-inside: avoid;">
                    FULLA DE RESPOSTES

                ${text.questions.map((q, i) => `
                    <div style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px dashed #e2e8f0; page-break-inside: avoid;">

      return (
        <div className="max-w-2xl mx-auto bg-white rounded-[32px] p-6 sm:p-8 shadow-duo-card border-[3px] border-slate-200 space-y-6">
          <div className="flex items-center justify-between">

                    <i className={`fa-solid ${text.icon}`}></i>
                  </div>
                  <div>
                    <h4 className="font-display font-black text-slate-800 text-base">{text.title}</h4>
                    <p className="text-xs text-slate-500 font-bold mt-0.5 line-clamp-1">{text.author} ({text.source})</p>
                  </div>
                </div>

                <button
                  disabled={isGenerating}
                  onClick={() => handleDownloadPDF(text)}
                  className={`px-5 py-3 rounded-[16px] font-display font-black text-sm shrink-0 border-b-[4px] border-2 transition-all w-full sm:w-auto flex items-center justify-center gap-2 ${
                    isGenerating 
                      ? 'bg-slate-200 text-slate-400 border-slate-300 cursor-wait' 
                      : 'bg-white text-duoBlue border-slate-200 hover:bg-slate-100 duo-pressable'
                  }`}
                >
                  <i className="fa-solid fa-file-pdf text-red-500"></i>
                  {isGenerating ? 'Generant...' : 'Descarregar PDF'}
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- VISTA DE PERFIL I LLIGUES AMB PROGRÉS REAL ---
    function ProfileView({ xp, gems, streak, hearts, nodeProgress, setCurrentView }) {
      const fileInputRef = useRef(null);

      const handleExport = () => {
        playSound('pop');
        const data = {
          cp_hearts: localStorage.getItem('cp_hearts'),
          cp_xp: localStorage.getItem('cp_xp'),
          cp_gems: localStorage.getItem('cp_gems'),
          cp_streak: localStorage.getItem('cp_streak'),
          cp_inventory: localStorage.getItem('cp_inventory'),
          cp_nodeProgress: localStorage.getItem('cp_nodeProgress')
        };
        const str = JSON.stringify(data);
        const enc = btoa(unescape(encodeURIComponent(str))).split('').reverse().join('');
        const blob = new Blob([enc], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'comprensio_progres.txt';
        a.click();
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const content = event.target.result;
            const dec = decodeURIComponent(escape(atob(content.split('').reverse().join(''))));
            const data = JSON.parse(dec);
            Object.keys(data).forEach(key => {
              if (data[key] !== null) localStorage.setItem(key, data[key]);
            });
            playSound('success');
            alert("Progrés restaurat correctament!");
            window.location.reload();
          } catch(err) {
            alert("El fitxer no és vàlid.");
          }
        };
        reader.readAsText(file);
      };

      useEffect(() => {
        const total = window.QuestionBank.TEXTS.length;
        let completed = 0;
        Object.values(nodeProgress).forEach(val => { if (val > 0) completed++; });

        const ctx = document.getElementById('statsChart');
        let chartInstance = null;
        if (ctx) {
          chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['Textos Completats', 'Pendents'],
              datasets: [{
                data: [completed, Math.max(0, total - completed)],
                backgroundColor: ['#1cb0f6', '#e2e8f0'],
                borderWidth: 2
              }]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }
        return () => { if (chartInstance) chartInstance.destroy(); };
      }, [nodeProgress]);

      // Lligues
      const leagues = [
        { name: "Lliga Bronze", min: 0, max: 200, color: "text-amber-700", bg: "bg-amber-100", border: "border-amber-300", icon: "fa-shield-halved" },
        { name: "Lliga Plata", min: 200, max: 500, color: "text-slate-600", bg: "bg-slate-200", border: "border-slate-300", icon: "fa-medal" },
        { name: "Lliga Or", min: 500, max: 1000, color: "text-yellow-600", bg: "bg-yellow-100", border: "border-yellow-300", icon: "fa-trophy" },
        { name: "Lliga Diamant", min: 1000, max: Infinity, color: "text-cyan-600", bg: "bg-cyan-100", border: "border-cyan-300", icon: "fa-gem" }
      ];

      const currentLeagueIdx = leagues.findIndex(l => xp >= l.min && xp < l.max);
      const currentLeague = leagues[currentLeagueIdx !== -1 ? currentLeagueIdx : leagues.length - 1];
      const nextLeague = leagues[currentLeagueIdx + 1];

      const xpNeededForNext = nextLeague ? nextLeague.min - xp : 0;
      const progressPerc = nextLeague 
        ? Math.min(100, Math.max(0, ((xp - currentLeague.min) / (nextLeague.min - currentLeague.min)) * 100))
        : 100;

      return (
        <div className="max-w-2xl mx-auto space-y-6 pb-12">
          <div className="flex items-center justify-between">
            <button onClick={() => setCurrentView('path')} className="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-slate-600 rounded-full font-bold text-2xl">
              <i className="fa-solid fa-arrow-left"></i>
            </button>
            <h2 className="text-2xl font-display font-black text-slate-800">El Meu Perfil</h2>
            <div className="w-10"></div>
          </div>

          <div className="bg-white rounded-[32px] p-6 shadow-duo-card border-[3px] border-slate-200 space-y-6">
            <div className="flex items-center gap-4 border-b-2 border-slate-100 pb-4">
              <div className="w-16 h-16 bg-blue-100 text-duoBlue rounded-full flex items-center justify-center text-3xl border-2 border-blue-200">
                <i className="fa-solid fa-graduation-cap"></i>
              </div>
              <div>
                <h3 className="font-display font-black text-xl text-slate-800">Estudiant PAU</h3>
                <p className="text-slate-400 font-bold text-xs mt-0.5">Nivell de Comprensió Lectora</p>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div className="bg-slate-50 p-4 rounded-[20px] border-2 border-slate-200">
                <i className="fa-solid fa-fire text-duoOrange text-2xl mb-1"></i>
                <div className="font-display font-black text-xl">{streak} Dies</div>
                <div className="text-xs text-slate-400 font-bold">Ratxa d'estudi</div>
              </div>
              <div className="bg-slate-50 p-4 rounded-[20px] border-2 border-slate-200">
                <i className="fa-solid fa-bolt text-duoBlue text-2xl mb-1"></i>
                <div className="font-display font-black text-xl">{xp} XP</div>
                <div className="text-xs text-slate-400 font-bold">Punts d'experiència</div>
              </div>
            </div>
          </div>

          {/* INDICADOR DE LLIGA I PROGRÉS FINS A LA SEGÜENT */}
          <div className="bg-white rounded-[32px] p-6 shadow-duo-card border-[3px] border-slate-200 space-y-5">
            <div className="flex items-center justify-between border-b-2 border-slate-100 pb-3">
              <h3 className="font-display font-black text-lg text-slate-800">Lliga de Classificació</h3>
              {nextLeague && (
                <span className="text-xs font-black bg-blue-50 text-duoBlue px-3 py-1 rounded-full border border-blue-200">
                  Falten {xpNeededForNext} XP per a {nextLeague.name}
                </span>
              )}
            </div>

            <div className="flex items-center gap-4">
              <div className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl shrink-0 border-2 ${currentLeague.bg} ${currentLeague.color} ${currentLeague.border}`}>
                <i className={`fa-solid ${currentLeague.icon}`}></i>
              </div>
              <div className="flex-1 space-y-2">
                <div className="flex justify-between items-center">
                  <h4 className="font-display font-black text-xl text-slate-800">{currentLeague.name}</h4>
                  <span className="text-xs font-bold text-slate-400">{xp} XP</span>
                </div>

                {nextLeague ? (
                  <div className="w-full bg-slate-200 h-3.5 rounded-full overflow-hidden border border-slate-300">
                    <div 
                      className="bg-duoBlue h-full transition-all duration-500 rounded-full"
                      style={{ width: `${progressPerc}%` }}
                    ></div>
                  </div>
                ) : (
                  <p className="text-xs font-bold text-emerald-600">Has assolit la lliga màxima de comprensió!</p>
                )}
              </div>
            </div>
          </div>

          {/* CÒPIA DE SEGURETAT */}
          <div className="bg-slate-50 rounded-[28px] p-6 border-2 border-slate-200 space-y-4 text-center">
            <h4 className="font-display font-black text-slate-800 text-base">Còpia de Seguretat del Progrés</h4>
            <div className="flex flex-col sm:flex-row gap-3 justify-center">
              <button onClick={handleExport} className="bg-white text-duoBlue font-display font-black py-3 px-5 rounded-[16px] border-2 border-slate-300 text-sm duo-pressable">
                <i className="fa-solid fa-download mr-2"></i>Descarregar Progrés
              </button>
              <input type="file" accept=".txt" ref={fileInputRef} onChange={handleImport} className="hidden" />
              <button onClick={() => fileInputRef.current.click()} className="bg-white text-duoEmerald font-display font-black py-3 px-5 rounded-[16px] border-2 border-slate-300 text-sm duo-pressable">
                <i className="fa-solid fa-upload mr-2"></i>Importar Progrés
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPONENT PRINCIPAL APP ---

      const [hearts, setHearts] = useState(() => parseInt(localStorage.getItem('cp_hearts') || '5', 10));
      const [xp, setXp] = useState(() => parseInt(localStorage.getItem('cp_xp') || '0', 10));
      const [gems, setGems] = useState(() => parseInt(localStorage.getItem('cp_gems') || '20', 10));
      const [streak, setStreak] = useState(() => parseInt(localStorage.getItem('cp_streak') || '1', 10));
      
      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('cp_inventory');
        return saved ? JSON.parse(saved) : { doubleXp: false, shield: 0 };
      });

      const [nodeProgress, setNodeProgress] = useState(() => {
        const saved = localStorage.getItem('cp_nodeProgress');
        return saved ? JSON.parse(saved) : {};
      });

      const [currentView, setCurrentView] = useState('path');
      const [activeText, setActiveText] = useState(null);
      const [showNoLivesModal, setShowNoLivesModal] = useState(false);
      
      // CPR States
      const [cprClicks, setCprClicks] = useState(0);
      const [isCprMode, setIsCprMode] = useState(false);

      useEffect(() => {
        localStorage.setItem('cp_hearts', hearts);
        localStorage.setItem('cp_xp', xp);
        localStorage.setItem('cp_gems', gems);
        localStorage.setItem('cp_streak', streak);
        localStorage.setItem('cp_inventory', JSON.stringify(inventory));
        localStorage.setItem('cp_nodeProgress', JSON.stringify(nodeProgress));
      }, [hearts, xp, gems, streak, inventory, nodeProgress]);

      const [sheet, setSheet] = useState({ isOpen: false, type: 'success', title: '', message: '', explanation: '', onContinue: null });

      const startText = (txt) => {
        if (hearts <= 0) {
          setShowNoLivesModal(true);
          return;
        }
        playSound('pop');
        setActiveText(txt);
        setCurrentView('reading');
      };

      const triggerSuccess = (title, message, exp, points = 25, callback = null) => {
        playSound('success');
        let earnedXp = points;
        if (inventory.doubleXp) {
          earnedXp = points * 2;
          setInventory(prev => ({ ...prev, doubleXp: false }));
        }

        setXp(x => x + earnedXp);
        setGems(g => g + 5);

        setSheet({
          isOpen: true,
          type: 'success',
          title: title || "MOLT BÉ!",
          message: message || "Resposta correcta.",
          explanation: (inventory.doubleXp ? "⚡ 2x XP Aplicat! " : "") + (exp || ""),
          onContinue: () => {
            setSheet(s => ({ ...s, isOpen: false }));
            if (callback) callback();
          }
        });
      };

      const triggerError = (title, message, exp) => {
        playSound('error');
        setSheet({
          isOpen: true,
          type: 'error',
          title: title || "ERROR",
          message: message || "Aquesta opció no és correcta.",
          explanation: exp || "",
          onContinue: () => setSheet(s => ({ ...s, isOpen: false }))
        });
      };

      const handleGameFinish = (textId, stars, points, title, finalScore) => {
        setNodeProgress(prev => ({ ...prev, [textId]: Math.max(prev[textId] || 0, stars) }));
        triggerConfetti();
        playSound('fanfare');
        setCurrentView('path');
        setSheet({
          isOpen: true,
          type: 'success',
          title: "ACTUACIÓ COMPLETADA",
          message: `La teva nota final és: ${finalScore} / 10`,
          explanation: "Ponderació aplicada a sobre de 10 respecte als punts obtinguts a la primera correcció de cada apartat.",
          onContinue: () => setSheet(s => ({ ...s, isOpen: false }))
        });
      };

      return (
        <div className="min-h-screen text-slate-800 flex flex-col font-sans">
          
          {/* HEADER FIX DUOLINGO */}
          {currentView === 'path' && (
            <header className="sticky top-0 z-40 bg-white border-b-[3px] border-slate-200 shadow-sm px-4 py-3">
              <div className="max-w-3xl mx-auto flex items-center justify-between">
                
                <div onClick={() => setCurrentView('path')} className="flex items-center gap-3 cursor-pointer">
                  <div className="w-10 h-10 rounded-[14px] bg-duoBlue flex items-center justify-center text-white text-xl font-black shadow-btn-blue border-2 border-black/10">
                    <i className="fa-solid fa-book-open"></i>
                  </div>
                  <h1 className="text-2xl font-display font-black text-slate-800 tracking-tight">
                    Comprens<span className="text-duoBlue">.io</span>
                  </h1>
                </div>

                <div className="flex items-center gap-4 font-display font-black text-sm">
                  {/* BOTÓ DE DESCÀRREGUES AFEGIT */}
                  <button onClick={() => setCurrentView('downloads')} className="text-slate-400 hover:text-slate-600 transition-colors">
                    <i className="fa-solid fa-download text-xl"></i>
                  </button>

                  <button onClick={() => setCurrentView('shop')} className="text-slate-400 hover:text-slate-600 transition-colors">
                    <i className="fa-solid fa-store text-xl"></i>
                  </button>

                  <button onClick={() => setCurrentView('profile')} className="text-slate-400 hover:text-slate-600 transition-colors">
                    <i className="fa-solid fa-user text-xl"></i>
                  </button>

                  <div className="flex items-center gap-1.5 text-duoOrange">
                    <i className="fa-solid fa-fire text-xl"></i>
                    <span>{streak}</span>
                  </div>

                  <div className="flex items-center gap-1.5 text-duoBlue">
                    <i className="fa-solid fa-gem text-xl"></i>
                    <span>{gems}</span>
                  </div>

                  <div className="flex items-center gap-1.5 text-duoRed">
                    <i className="fa-solid fa-heart text-xl"></i>
                    <span>{hearts}</span>
                  </div>
                </div>

              </div>
            </header>
          )}

          {/* VISTES PRINCIPALS */}
          <main className="flex-1 max-w-3xl w-full mx-auto p-4 md:p-6 my-2">
            <AnimatePresence mode="wait">
              {currentView === 'path' && (
                <PathMap key="path" texts={window.QuestionBank.TEXTS} setCurrentView={setCurrentView} startText={startText} nodeProgress={nodeProgress} />
              )}
              {currentView === 'downloads' && (
                <DownloadView key="downloads" setCurrentView={setCurrentView} texts={window.QuestionBank.TEXTS} />
              )}
              {currentView === 'shop' && (
                <ShopView key="shop" gems={gems} setGems={setGems} hearts={hearts} setHearts={setHearts} inventory={inventory} setInventory={setInventory} setCurrentView={setCurrentView} />
              )}
              {currentView === 'profile' && (
                <ProfileView key="profile" xp={xp} gems={gems} streak={streak} hearts={hearts} nodeProgress={nodeProgress} setCurrentView={setCurrentView} />
              )}
              {currentView === 'reading' && activeText && (
                <GameReading 
                  key="reading" 
                  textData={activeText} 
                  setCurrentView={setCurrentView} 
                  onSuccess={triggerSuccess} 
                  onError={triggerError} 
                  onFinish={handleGameFinish} 
                  hearts={hearts}
                  setHearts={setHearts}
                  inventory={inventory} 
                  setInventory={setInventory} 
                  setShowNoLivesModal={setShowNoLivesModal}
                />
              )}
            </AnimatePresence>
          </main>

          {/* MODAL REANIMACIÓ / SENSE VIDES (ESTIL DUOLINGO) */}
          <AnimatePresence>
            {showNoLivesModal && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
                <motion.div initial={{ scale: 0.9, y: 20 }} animate={{ scale: 1, y: 0 }} exit={{ scale: 0.9, y: 20 }} className="bg-white rounded-[32px] p-8 max-w-sm w-full text-center space-y-6 shadow-2xl border-4 border-slate-200">
                  
                  {!isCprMode ? (
                    <>
                      <div className="w-24 h-24 bg-red-100 text-duoRed rounded-full flex items-center justify-center text-5xl mx-auto border-4 border-red-200 animate-bounce">
                        💔
                      </div>
                      <div>
                        <h2 className="text-3xl font-display font-black text-slate-800">T'has quedat sense vides!</h2>
                        <p className="text-slate-500 font-bold text-sm mt-2">Pots recuperar vides en la botiga amb les teves gemes, esperar o fer una RCP.</p>
                      </div>

                      <div className="space-y-3">
                        <button 
                          onClick={() => {
                            if (gems >= 20) {
                              setGems(g => g - 20);
                              setHearts(2);
                              setShowNoLivesModal(false);
                              playSound('gemGain');
                            } else {
                              alert("No tens suficients gemes.");
                            }
                          }}
                          className="w-full bg-duoRed text-white font-display font-black text-lg py-4 rounded-[20px] shadow-btn-red border-x-2 border-t-2 border-b-[6px] border-black/10 duo-pressable flex items-center justify-center gap-2"
                        >
                          <span>Recuperar Vides (+2 ❤️)</span>
                          <span className="bg-black/20 px-2.5 py-0.5 rounded-full text-xs">20 💎</span>
                        </button>

                        <button 
                          onClick={() => {
                            setIsCprMode(true);
                            setCprClicks(0);
                          }}
                          className="w-full bg-duoPurple text-white font-display font-black text-lg py-4 rounded-[20px] shadow-btn-purple border-x-2 border-t-2 border-b-[6px] border-black/10 duo-pressable"
                        >
                          Reanimar (RCP) - Torna al mapa
                        </button>

                        <button 
                          onClick={() => { setShowNoLivesModal(false); setIsCprMode(false); setCurrentView('path'); }}
                          className="w-full bg-slate-100 text-slate-500 font-display font-black text-lg py-4 rounded-[20px] border-2 border-slate-200 hover:bg-slate-200"
                        >
                          Sortir al Mapa
                        </button>
                      </div>
                    </>
                  ) : (
                    <>
                      <div 
                        className="w-32 h-32 bg-red-100 text-duoRed rounded-full flex items-center justify-center text-6xl mx-auto border-4 border-red-200 cursor-pointer select-none active:scale-90 transition-transform"
                        onClick={() => {
                          playSound('pop');
                          const nextClicks = cprClicks + 1;
                          setCprClicks(nextClicks);
                          if (nextClicks >= 10) {
                            setHearts(5);
                            setIsCprMode(false);
                            setCprClicks(0);
                            setShowNoLivesModal(false);
                            setCurrentView('path');
                          }
                        }}
                      >
                        ❤️
                      </div>
                      <div>
                        <h2 className="text-3xl font-display font-black text-slate-800">Fes la RCP!</h2>
                        <p className="text-slate-500 font-bold text-sm mt-2">Clica ràpid el cor 10 vegades per recuperar 5 vides. ATENCIÓ: Tornaràs al mapa perdent l'exercici actual.</p>
                      </div>
                      <div className="w-full bg-slate-200 h-6 rounded-full overflow-hidden mt-4">
                        <div className="bg-duoRed h-full transition-all" style={{ width: `${(cprClicks/10)*100}%` }}></div>
                      </div>
                      <div className="mt-2 text-duoRed font-black text-xl">{cprClicks}/10 Clics</div>
                    </>
                  )}

                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>

          {/* BOTTOM SHEET MODAL DUOLINGO */}
          <AnimatePresence>
            {sheet.isOpen && (
              <>
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 bg-slate-900/20 z-40" onClick={() => sheet.onContinue && sheet.onContinue()} />
                <motion.div 
                  initial={{ y: "100%" }} animate={{ y: 0 }} exit={{ y: "100%" }} transition={{ type: "spring", damping: 25, stiffness: 200 }}
                  className={`fixed bottom-0 left-0 right-0 z-50 p-6 sm:p-8 rounded-t-[32px] border-t-2 ${
                    sheet.type === 'success' ? 'bg-duoBgSuccess border-duoGreen' : 'bg-duoBgError border-duoRed'
                  }`}
                >
                  <div className="max-w-3xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
                    <div className="flex items-start gap-4">
                      <div className={`w-14 h-14 rounded-full flex items-center justify-center text-3xl shrink-0 bg-white shadow-sm border-2 ${
                        sheet.type === 'success' ? 'text-duoGreen border-duoBgSuccess' : 'text-duoRed border-duoBgError'
                      }`}>
                        <i className={`fa-solid ${sheet.type === 'success' ? 'fa-check' : 'fa-xmark'}`}></i>
                      </div>
                      <div className="space-y-1 pt-1">
                        <h3 className={`font-display font-black text-2xl ${sheet.type === 'success' ? 'text-duoTextSuccess' : 'text-duoTextError'}`}>
                          {sheet.title}
                        </h3>
                        <p className={`text-base font-bold ${sheet.type === 'success' ? 'text-duoTextSuccess' : 'text-duoTextError'} opacity-90`}>
                          {sheet.message}
                        </p>
                        <p className={`text-sm font-bold ${sheet.type === 'success' ? 'text-duoTextSuccess' : 'text-duoTextError'} opacity-75 mt-1 whitespace-pre-line`}>
                          {sheet.explanation}
                        </p>
                      </div>
                    </div>

                    <button 
                      onClick={sheet.onContinue}
                      className={`w-full sm:w-auto min-w-[180px] font-display font-black text-lg py-4 px-8 rounded-[20px] active:translate-y-1 transition-transform border-x-2 border-t-2 border-b-[6px] border-black/10 duo-pressable ${
                        sheet.type === 'success' ? 'bg-duoGreen text-white shadow-btn-green' : 'bg-duoRed text-white shadow-btn-red'
                      }`}
                    >
                      Continuar
                    </button>
                  </div>
                </motion.div>
              </>
            )}
          </AnimatePresence>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
